# Ambiente de desenvolvimento do FeatureHub: base de dados, API, worker e frontend.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: featurehub
      POSTGRES_PASSWORD: featurehub
      POSTGRES_DB: featurehub
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U featurehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &backend-env
      DATABASE_URL: postgres://featurehub:featurehub@db:5432/featurehub
      DJANGO_SECRET_KEY: change-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      WORKER_INTERVAL_SECONDS: "10"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: python manage.py run_worker
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  db-data:
